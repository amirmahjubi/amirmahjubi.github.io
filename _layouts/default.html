<!DOCTYPE html>
<html lang="en">
  {% include head.html %}
  <body>
    <canvas class="starfield" data-stars aria-hidden="true"></canvas>
    <div class="cursor-glow" data-cursor-glow aria-hidden="true"></div>
    <a class="skip-link" href="#main">Skip to content</a>
    {% include header.html %}
    <main id="main">
      {{ content }}
    </main>
    {% include footer.html %}
    <button class="to-top" type="button" data-to-top aria-label="Back to top" hidden>
      <span class="to-top__ring to-top__ring--outer" aria-hidden="true"></span>
      <span class="to-top__ring to-top__ring--mid" aria-hidden="true"></span>
      <span class="to-top__core" aria-hidden="true"></span>
      <span class="to-top__arrow" aria-hidden="true">↑</span>
    </button>
    <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
  </body>
</html>
