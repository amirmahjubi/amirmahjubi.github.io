---
layout: default
---

<article class="page">
  <header class="page__header">
    <p class="eyebrow">{{ page.eyebrow | default: "Page" }}</p>
    <h1 class="page__title">{{ page.title }}</h1>
    {% if page.subtitle %}
      <p class="page__subtitle">{{ page.subtitle }}</p>
    {% endif %}
  </header>
  <div class="prose">
    {{ content }}
  </div>
</article>
