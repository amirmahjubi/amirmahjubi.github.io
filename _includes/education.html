<section class="section section--alt" id="education">
  <div class="section__inner">
    <header class="section__header reveal" data-reveal>
      <span class="file-tag">Case File 04</span>
      <h2 class="section__title">Origins</h2>
      <p class="section__lede">Computer engineering with a focus on software and AI.</p>
    </header>

    <ol class="strip">
      {% for item in site.data.education %}
        <li class="strip__item reveal" data-reveal>
          <div class="strip__marker" aria-hidden="true"><span></span></div>
          <div class="strip__panel panel" data-tilt>
            <div class="panel__meta">
              <span class="panel__org">{{ item.period }} · {{ item.location }}</span>
            </div>
            <h3 class="panel__title">{{ item.degree }}</h3>
            <p class="strip__company">{{ item.school }}</p>
            {% if item.detail %}
              <p class="strip__detail">{{ item.detail }}</p>
            {% endif %}
          </div>
        </li>
      {% endfor %}
    </ol>
  </div>
</section>
