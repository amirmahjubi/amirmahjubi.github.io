<section class="hero" aria-label="Introduction" data-hero>
  <div class="hero__skyline" aria-hidden="true">
    <img src="{{ '/assets/images/gotham/skyline.jpg' | relative_url }}" alt="" width="1600" height="900" decoding="async">
  </div>
  <div class="hero__searchlight" aria-hidden="true"></div>
  <div class="hero__blinds" aria-hidden="true"></div>

  <div class="hero__inner">
    <div class="hero__copy">
      <span class="file-tag reveal" data-reveal>Gotham File · 01</span>

      <p class="hero__brand" aria-label="{{ site.title }}">
        <span class="hero__brand-word" data-split="Amir">Amir</span><span class="hero__brand-space"> </span><br class="hero__brand-break" aria-hidden="true"><span class="hero__brand-word" data-split="Mahjubi">Mahjubi</span>
      </p>

      <h1 class="hero__title reveal" data-reveal>
        <span class="hero__title-badge">{{ site.tagline }}</span>
      </h1>

      <p class="hero__lede reveal" data-reveal>
        I design and ship machine learning systems — retrieval pipelines,
        agent workflows, and models that hold up after midnight in production.
      </p>

      <div class="hero__actions reveal" data-reveal>
        <a class="btn btn--primary" href="{{ '/#work' | relative_url }}" data-magnetic>Open the case files</a>
        <a class="btn btn--ghost" href="{{ '/#contact' | relative_url }}" data-magnetic>Send a signal</a>
      </div>
    </div>

    <div class="hero__portrait-wrap reveal" data-reveal>
      <button class="portrait" type="button" data-portal aria-label="Descend to selected work">
        <span class="portrait__deco" aria-hidden="true"></span>
        <span class="portrait__frame">
          <img class="portrait__photo" src="{{ '/assets/images/amir-portal.jpg' | relative_url }}" alt="Portrait of {{ site.author }}" width="360" height="360" fetchpriority="high" decoding="async">
        </span>
        <span class="portrait__hint" aria-hidden="true">Descend</span>
      </button>
      <p class="hero__caption">Tehran nights · production AI</p>
    </div>
  </div>

  <div class="hero__scroll" aria-hidden="true">
    <span>Scroll</span>
  </div>
</section>
