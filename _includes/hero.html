<section class="hero" aria-label="Introduction">
  <div class="hero__atmosphere" aria-hidden="true"></div>
  <div class="hero__grid" aria-hidden="true"></div>
  <div class="hero__inner">
    <p class="hero__brand reveal" data-reveal>{{ site.title }}</p>
    <h1 class="hero__title reveal" data-reveal>
      {{ site.tagline }}
    </h1>
    <p class="hero__lede reveal" data-reveal>
      I design and ship machine learning systems — from retrieval pipelines
      and agent workflows to models that hold up in production.
    </p>
    <div class="hero__actions reveal" data-reveal>
      <a class="btn btn--primary" href="{{ '/#work' | relative_url }}">View selected work</a>
      <a class="btn btn--ghost" href="{{ '/#contact' | relative_url }}">Get in touch</a>
    </div>
  </div>
  <div class="hero__scroll" aria-hidden="true">
    <span>Scroll</span>
  </div>
</section>
